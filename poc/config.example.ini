[transliteration]
# Command to call for transliteration. Should accept newline-separated Tamil inputs on stdin
# and output either JSON mapping or newline-separated transliterations. Example:
# transliteration_cmd = /usr/bin/python3 /path/to/transliterateGPT.py --stdin-json
transliteration_cmd =

[cache]
# Path to persistent cache file
path = poc/cache/transliteration_cache.json
# TTL in seconds (leave blank for no expiry)
ttl_seconds =

[scraper]
# Base page URL for pasuram scraping
base_url = https://www.dravidaveda.org
# Pasuram number range to scrape for the POC
start = 647
end = 650
# Metadata for the selected prabandham
prabandham = பெருமாள் திருமொழி
title = பெருமாள் திருமொழி, Perumal ThiruMozhi
alzwar = குலசேகர் ஆழ்வார்
pattu_number =
# Starting pattu number for the first scraped pasuram
pattu_number_start = 1

[cache]
# Path to persistent cache file
path = poc/cache/transliteration_cache.json
# TTL in seconds (leave blank for no expiry)
ttl_seconds =

[transliteration]
# Command to call for transliteration. Should accept newline-separated Tamil inputs on stdin
# and output either JSON mapping or newline-separated transliterations. Example:
# transliteration_cmd = /usr/bin/python3 /path/to/transliterate_wrapper.py --stdin
transliteration_cmd =
use_gpt_adapter = false

[poc]
# Number of items per batch when calling transliteration command
batch_size = 10

[db]
# MySQL credentials for loading JSON into PasuramsArthamTablePOC
host = localhost
port = 3306
user = your_user
password = your_password
database = your_database
table = PasuramsArthamTablePOC
use_ssl = false

# UAT: copy to poc/config.test.ini and set table = PasuramsArthamTableTest
# See poc/UAT_THIRUVANDHATHI.md and load with --config poc/config.test.ini
